                  type: string
                  description: 机构用户账号ID（机构用户授权取消场景返回）
                cancelAuthorizedScope:
                  type: string
                  description: 失效的授权范围（多个范围以逗号分隔）
                operatorPsnId:
                  type: string
                  description: 操作人账号ID（若有则返回）
                operateTime:
                  type: integer
                  format: int64
                  description: 操作时间（毫秒级时间戳格式）
