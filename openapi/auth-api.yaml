webhooks:
  authPass:
    post:
      summary: 实名认证通过通知
      description: |
        触发条件：个人或企业实名认证通过时，e签宝通过 HTTP POST 推送此回调通知。
        action 固定值：AUTH_PASS。
        回调通知Url地址通过【获取个人认证&授权页面链接】或【获取机构认证&授权页面链接】接口的 notifyUrl 字段配置，
        或在e签宝开放平台 Webhook 事件订阅中勾选 v3版认证授权 相关配置项（推荐）。
        回调安全机制：支持 IP 白名单模式和签名验签模式（HMAC-SHA256）。
        重试机制：通知失败后最多重试 16 次；开发者需在 5 秒内返回 HTTP 状态码 200-299。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - authFlowId
                - timestamp
                - authType
                - bizType
              properties:
                action:
                  type: string
                  description: 标记该通知的业务类型，该通知固定为 AUTH_PASS
                  enum:
                    - AUTH_PASS
                authFlowId:
                  type: string
                  description: 用户认证&授权流程ID
                timestamp:
                  type: integer
                  format: int64
                  description: 回调通知触发时间，Unix时间戳，单位：毫秒
                authType:
                  type: string
                  description: "认证主体类型：PSN — 个人认证，ORG — 机构认证"
                  enum:
                    - PSN
                    - ORG
                bizType:
                  type: string
                  description: |
                    业务类型：
                    - REAL_NAME — 实名认证
                    - UPDATE-INFO — 信息变更（仅企业更名且之前已实名时触发）
                  enum:
                    - REAL_NAME
                    - UPDATE-INFO
                psnInfo:
                  type: object
                  description: 个人认证信息（个人认证场景返回此参数）
                  properties:
                    psnId:
                      type: string
                      description: 个人账号ID
                    psnAccount:
                      type: object
                      description: 个人账号信息
                      properties:
                        accountMobile:
                          type: string
                          description: 手机号（个人账号标识）
                        accountEmail:
                          type: string
                          description: 邮箱号（个人账号标识）
                organization:
                  type: object
                  description: 机构认证信息（机构认证场景返回此参数）
                  properties:
                    orgId:
                      type: string
                      description: 机构账号ID
                    orgName:
                      type: string
                      description: 机构名称
                    transactor:
                      type: object
                      description: 经办人认证信息
                      properties:
                        psnId:
                          type: string
                          description: 经办人账号ID
                        psnAccount:
                          type: object
                          description: 经办人账号信息
                          properties:
                            accountMobile:
                              type: string
                              description: 手机号（经办人账号标识）
                            accountEmail:
                              type: string
                              description: 邮箱号（经办人账号标识）
            examples:
              psnExample:
                summary: 个人实名认证通知示例
                value:
                  authFlowId: "OF-308xxxxxx0057"
                  timestamp: 1724984592073
                  authType: "PSN"
                  bizType: "REAL_NAME"
                  psnInfo:
                    psnId: "d77a938xxxxxxx5e67c04e9"
                    psnAccount:
                      accountMobile: "17xxxxxx02"
                  action: "AUTH_PASS"
              orgExample:
                summary: 机构实名认证通知示例
                value:
                  authFlowId: "OF-30f3cxxx8000e"
                  timestamp: 1724984941307
                  authType: "ORG"
                  bizType: "REAL_NAME"
                  organization:
                    orgId: "25ce887c568xxxxxx56d4aca9"
                    orgName: "****科技有限公司"
                    transactor:
                      psnId: "cb603eb5dbxxxxxxxxb77e87b09"
                      psnAccount:
                        accountMobile: "13xxxxxx70"
                  action: "AUTH_PASS"
      responses:
        "200":
          description: 开发者业务系统成功接收回调通知，返回 HTTP 状态码 200-299 均视为成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "200"
                  msg:
                    type: string
                    example: "success"

  authorizeFinish:
    post:
      summary: 授权完成通知
      description: |
        触发条件：用户完成授权操作时，e签宝通过 HTTP POST 推送此回调通知。
        action 固定值：AUTHORIZE_FINISH。
        回调通知Url地址通过【获取个人认证&授权页面链接】或【获取机构认证&授权页面链接】接口的 notifyUrl 字段配置，
        或在e签宝开放平台 Webhook 事件订阅中勾选 v3版认证授权 相关配置项（推荐）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - timestamp
                - psnId
                - authFlowId
                - authorizedInfo
              properties:
                action:
                  type: string
                  description: 通知的业务类型，固定值：AUTHORIZE_FINISH
                  enum:
                    - AUTHORIZE_FINISH
                timestamp:
                  type: integer
                  format: int64
                  description: 回调通知发送时间，Unix时间戳（毫秒）
                psnId:
                  type: string
                  description: 个人账号ID（经办人账号ID）
                orgId:
                  type: string
                  description: 机构账号ID
                authFlowId:
                  type: string
                  description: 用户认证&授权流程ID
                authorizedInfo:
                  type: array
                  description: 用户授权信息
                  items:
                    type: object
                    properties:
                      authorizedScope:
                        type: string
                        description: |
                          授权范围：
                          个人用户（企业授权场景为经办人）：
                          - get_psn_identity_info — 授权允许获取个人账号基本信息
                          - psn_initiate_sign — 授权允许代替用户发起合同签署
                          - manage_psn_resource — 授权允许获取用户的模板、印章等资源的权限
                          企业机构用户：
                          - get_org_identity_info — 授权允许获取机构用户账号基本信息
                          - org_initiate_sign — 授权允许代替机构用户发起合同签署
                          - manage_org_resource — 授权允许获取机构用户的模板、印章、组织成员等资源的权限
                          - use_org_order — 授权允许获取机构用户套餐订单的使用权限
                      effectiveTime:
                        type: integer
                        format: int64
                        description: 授权生效时间（unix时间戳，单位：毫秒）
                      expireTime:
                        type: integer
                        format: int64
                        description: 授权失效时间（unix时间戳，单位：毫秒）
                legalRepCheck:
                  type: boolean
                  description: |
                    本次操作的机构经办人是否为企业法人：true — 是，false — 否
                adminCheck:
                  type: boolean
                  description: |
                    本次操作的机构经办人是否为企业管理员：true — 是，false — 否
                transactorUseSeal:
                  type: boolean
                  description: |
                    本次操作的机构经办人是否获得了用印权限（经办人未成为企业管理员或法人的情况下存在）：true — 是，false — 否
            example:
              timestamp: 1697081866002
              psnId: "c92520exxxxx2246bd9b50f"
              orgId: "3c404xxxxx940279134e7"
              authFlowId: "OF-2a74xxxx8005a"
              authorizedInfo:
                - authorizedScope: "use_org_order"
                  effectiveTime: 1697081865883
                  expireTime: 4819145865883
                - authorizedScope: "manage_org_resource"
                  effectiveTime: 1697081865883
                  expireTime: 4819145865883
                - authorizedScope: "get_org_identity_info"
                  effectiveTime: 1697081865883
                  expireTime: 4819145865883
                - authorizedScope: "get_psn_identity_info"
                  effectiveTime: 1697081865883
                  expireTime: 4819145865883
              legalRepCheck: false
              adminCheck: false
              transactorUseSeal: true
              action: "AUTHORIZE_FINISH"
      responses:
        "200":
          description: 开发者业务系统成功接收回调通知，返回 HTTP 状态码 200-299 均视为成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "200"
                  msg:
                    type: string
                    example: "success"

  authorizeChange:
    post:
      summary: 授权范围变更通知
      description: |
        触发条件：用户登录e签宝官网主动取消授权时，e签宝通过 HTTP POST 推送此回调通知。
        action 固定值：AUTHORIZE_CHANGE。
        注意：此回调通知仅支持通过e签宝开放平台 Webhook 事件订阅配置（勾选"用户授权范围变更"事件），
        不支持通过接口 notifyUrl 参数设置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - timestamp
                - cancelAuthorizedScope
                - operatorPsnId
                - operateTime
              properties:
                action:
                  type: string
                  description: 通知的业务类型，固定值：AUTHORIZE_CHANGE
                  enum:
                    - AUTHORIZE_CHANGE
                timestamp:
                  type: integer
                  format: int64
                  description: 回调通知发送时间（如重试多次均返回第一次时间，毫秒级时间戳格式）
                psnId:
                  type: string
                  description: |
                    个人用户账号ID。
                    个人用户授权取消场景返回。返回已实名未注销的个人账号，若该个人证件号绑定的多个e签宝账号均在同一 appId 下授权过，则分多次回调发送。
