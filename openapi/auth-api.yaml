  /v3/auth-flow/{authFlowId}:
    get:
      tags:
        - 查询
      summary: 查询认证授权流程详情
      description: |
        查询本次认证授权流程的详细信息。
        通过【获取个人认证&授权页面链接】或【获取机构认证&授权页面链接】接口中返回的 authFlowId 来查询本次授权和认证的详情信息。
      operationId: getAuthFlowDetail
      parameters:
        - name: authFlowId
          in: path
          required: true
          schema:
            type: string
          description: 认证授权流程ID（由获取个人/机构认证&授权页面链接接口返回）
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          authFlowId:
                            type: string
                            description: 认证授权流程ID
                          authType:
                            type: string
                            description: "认证授权主体类型：ORG — 机构实名认证，PSN — 个人实名认证"
                            enum:
                              - ORG
                              - PSN
                          realNameOrWillingness:
                            type: string
                            description: |
                              流程中使用的认证类型：
                              - realName — 实名认证
                              - willingness — 意愿认证
                              - none — 都没使用
                            enum:
                              - realName
                              - willingness
                              - none
                          realNameOrWillingnessFlowId:
                            type: string
                            description: 认证流程ID（e签宝其他业务串联使用，常规场景不需要）。若 realNameOrWillingness 为 none，则该字段返回 0。
                          realNameStatus:
                            type: integer
                            format: int32
                            description: "认证流程状态：0 — 未实名，1 — 已实名"
                            enum: [0, 1]
                          authorizedStatus:
                            type: integer
                            format: int32
                            description: |
                              授权流程状态：
                              - 0 — 流程过期失效
                              - 1 — 已授权
                              - 2 — 授权中
                              - 3 — 审批未通过
                            enum: [0, 1, 2, 3]
                          authUrl:
                            type: string
                            description: 认证授权长链接
                          authInfo:
                            type: object
                            description: 认证详情
                            properties:
                              willingnessAuthModes:
                                type: string
                                description: |
                                  流程中使用的意愿认证方式：
                                  - CODE_SMS — 短信验证码
                                  - CODE_EMAIL — 邮箱验证码
                                  - PSN_FACE_ALIPAY — 支付宝刷脸
                                  - PSN_FACE_TECENT — 腾讯云刷脸
                                  - PSN_FACE_ESIGN — 快捷刷脸
                                  - PSN_FACE_WECHAT — 微信小程序刷脸
                                enum:
                                  - CODE_SMS
                                  - CODE_EMAIL
                                  - PSN_FACE_ALIPAY
                                  - PSN_FACE_TECENT
                                  - PSN_FACE_ESIGN
                                  - PSN_FACE_WECHAT
                              psnAuthMode:
                                type: string
                                description: |
                                  本次流程中使用的个人/经办人认证方式：
                                  - PSN_BANKCARD4 — 个人银行卡四要素认证
                                  - PSN_MOBILE3 — 手机运营商三要素认证
                                  - PSN_BANKCARD4_DETAILS — 个人银行卡四要素认证（详情版）
                                  - PSN_MOBILE3_DETAILS — 个人运营商三要素认证（详情版）
                                  - PSN_FACE — 刷脸认证
                                enum:
                                  - PSN_BANKCARD4
                                  - PSN_MOBILE3
                                  - PSN_BANKCARD4_DETAILS
                                  - PSN_MOBILE3_DETAILS
                                  - PSN_FACE
                              orgAuthMode:
                                type: string
                                description: |
                                  本次流程中机构实名认证使用的认证方式：
                                  - ORG_BANK_TRANSFER — 对公账户打款认证
                                  - ORG_ALIPAY_CREDIT — 企业支付宝认证
                                  - ORG_LEGALREP_AUTHORIZATION — 授权委托书认证
                                  - ORG_LEGALREP — 法定代表人本人实名认证
                                  - ORG_LEGALREP_WILLINGNESS — 法定代表人本人意愿认证
                                enum:
                                  - ORG_BANK_TRANSFER
                                  - ORG_ALIPAY_CREDIT
                                  - ORG_LEGALREP_AUTHORIZATION
                                  - ORG_LEGALREP
                                  - ORG_LEGALREP_WILLINGNESS
                              authFlowCreateTime:
                                type: integer
                                format: int64
                                description: 流程创建时间（Unix时间戳，单位：毫秒）
                              authFlowUpdateTime:
                                type: integer
                                format: int64
                                description: 流程最后更新时间（Unix时间戳，单位：毫秒）
                              person:
                                type: object
                                description: |
                                  个人以及机构经办人信息。
                                  个人认证&授权场景返回个人信息；机构认证&授权场景返回经办人信息。
                                properties:
                                  psnId:
                                    type: string
                                    description: 个人账号ID
                                  psnAccount:
                                    type: object
                                    description: 个人账号标识（手机号/邮箱）
                                    properties:
                                      accountMobile:
                                        type: string
                                        description: 手机号（个人账号标识）
                                      accountEmail:
                                        type: string
                                        description: 邮箱（个人账号标识）
                                  psnInfo:
                                    type: object
                                    description: 个人身份信息（需要发起认证授权时指定 get_psn_identity_info 权限才会返回）
                                    properties:
                                      psnName:
                                        type: string
                                        description: 个人姓名
                                      psnNationality:
                                        type: string
                                        description: 个人用户已认证的国籍/地区（默认不返回值）
                                      psnIDCardNum:
                                        type: string
                                        description: 个人用户已认证的证件号
                                      psnIDCardType:
                                        type: string
                                        description: 个人证件类型
                                        enum:
                                          - CRED_PSN_CH_IDCARD
                                          - CRED_PSN_CH_HONGKONG
                                          - CRED_PSN_CH_MACAO
                                          - CRED_PSN_CH_TWCARD
                                          - CRED_PSN_PASSPORT
                                      bankCardNum:
                                        type: string
                                        description: 个人用户已认证的银行卡号
                                      psnMobile:
                                        type: string
                                        description: 个人用户已认证的运营商实名登记手机号或银行卡预留手机号
                                  faceRecognitionInfo:
                                    type: object
                                    description: 人脸识别信息
                                    properties:
                                      facePhotoUrl:
                                        type: string
                                        description: 刷脸认证时刷脸照片（base64编码）。默认不返回，需联系e签宝开通。仅腾讯云人脸识别、快捷人脸识别或微信小程序刷脸时返回。地址有效期1小时，照片保存180天。
                                      similarityScore:
                                        type: string
                                        description: 刷脸照片相似度得分。仅腾讯云人脸识别、快捷人脸识别或微信小程序刷脸时返回。
                                      livingScore:
                                        type: string
                                        description: 刷脸活体检测得分。仅腾讯云人脸识别、快捷人脸识别或微信小程序刷脸时返回。
                                      idCardFront:
                                        type: string
                                        description: 刷脸认证时上传的身份证正面照片（base64编码）。默认不返回，需联系e签宝开通。仅微信小程序使用e签宝微信小程序刷脸时返回。地址有效期1小时，照片保存180天。
                                      idCardBack:
                                        type: string
                                        description: 刷脸认证时上传的身份证反面照片（base64编码）。默认不返回，需联系e签宝开通。仅微信小程序使用e签宝微信小程序刷脸时返回。地址有效期1小时，照片保存180天。
                              organization:
                                type: object
                                description: 实名认证的机构信息
                                properties:
                                  orgId:
                                    type: string
                                    description: 机构账号ID
                                  orgName:
                                    type: string
                                    description: 组织机构名称（账号标识）
                                  orgInfo:
                                    type: object
                                    description: 组织机构信息
                                    properties:
                                      orgIDCardNum:
                                        type: string
                                        description: 组织机构证件号
                                      orgIDCardType:
                                        type: string
                                        description: 组织机构证件类型
                                        enum:
                                          - CRED_ORG_USCC
                                          - CRED_ORG_REGCODE
                                      legalRepName:
                                        type: string
                                        description: 法定代表人姓名
                                      legalRepIDCardNum:
                                        type: string
                                        description: 法定代表人证件号
                                      legalRepIDCardType:
                                        type: string
                                        description: 法定代表人证件类型
                                        enum:
                                          - CRED_PSN_CH_IDCARD
                                          - CRED_PSN_CH_HONGKONG
                                          - CRED_PSN_CH_MACAO
                                          - CRED_PSN_CH_TWCARD
                                          - CRED_PSN_PASSPORT
                          authorizedInfo:
                            type: array
                            description: 本次授权详情
                            items:
                              $ref: '#/components/schemas/AuthorizedInfoItem'
              example:
                code: 0
                message: 成功
                data:
                  authFlowId: "OF-1f7f8****608004f"
