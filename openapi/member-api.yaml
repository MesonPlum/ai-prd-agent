      summary: 查询个人用户是否为企业成员
      description: |
        用于确认 e签宝 SaaS 账号下某个个人用户是否为某个企业/机构的成员。

        **注意：该接口可以不提前做认证授权。**

        当一个人存在多个 e签宝 账号，只要证件号相同，则认为其存在于该企业中。
        例如：张三使用手机号注册账号A加入甲企业，张三又使用邮箱注册账号B，使用账号B查询，返回结果也是张三在甲企业中的。
      operationId: checkOrgMembership
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
          description: 机构账号 ID（企业的 e签宝 SaaS 账号）。可通过【查询机构认证信息】接口获取
          example: "3c4047cc3****0279134e7"
        - name: psnId
          in: query
          required: true
          schema:
            type: string
          description: 个人账号 ID（个人的 e签宝 SaaS 账号）。可通过【查询个人认证信息】接口获取
          example: "626629f48****f1d8c1d"
