# ─────────────────────────────────────────────
# Webhook 回调事件
# ─────────────────────────────────────────────
webhooks:
  ACCOUNT_UNBIND:
    post:
      tags:
        - 账号管理
      summary: 账号解绑成功通知
      description: |
        **触发条件**：当在开发者发起的 e签宝 SaaS 账号解绑页面链接中操作账号解绑成功时触发。

        **回调安全机制**：
        - e签宝 通过 HTTP POST 方式推送 JSON 数据到开发者配置的回调 URL。
        - 开发者可使用请求头中的签名信息（`X-Tsign-Open-SIGNATURE`）进行验签，算法为 `hmac-sha256`。
        - 签名数据 = `X-Tsign-Open-TIMESTAMP` + query参数值（按key ASCII升序排序后拼接） + body字节流，使用 appSecret 计算。

        **响应要求**：
        - 返回 HTTP 状态码 200~299 即视为通知成功。
        - 建议在 5 秒内响应，超时请使用异步方式处理业务。
        - 通知失败后 e签宝 将最多重试 16 次。

        **订阅方式**：在开放平台 Webhook 事件订阅中勾选「v3 账号管理」相关配置项。
      operationId: onAccountUnbind
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - timestamp
                - account
                - customBizNum
              properties:
                action:
                  type: string
                  enum:
                    - ACCOUNT_UNBIND
                  description: 通知的业务类型，固定值：`ACCOUNT_UNBIND`
                  example: "ACCOUNT_UNBIND"
                timestamp:
                  type: integer
                  format: int64
                  description: 回调通知发送时间（如重试多次均返回第一次时间），毫秒级时间戳
                  example: 1729763155255
                account:
                  type: string
                  description: 解绑成功的用户登录凭证：手机号或邮箱
                  example: "jilinXXXX@XXX.cn"
                customBizNum:
                  type: string
                  description: 自定义业务编码（开发者发起时传入的自定义标识）
                  example: "标识本次解绑任务标识001"
            example:
              customBizNum: "标识本次解绑任务标识001"
              account: "jilinXXXX@XXX.cn"
              timestamp: 1729763155255
              action: "ACCOUNT_UNBIND"
      responses:
        '200':
          description: 通知接收成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "200"
                  msg:
                    type: string
                    example: "success"
              example:
                code: "200"
                msg: "success"

  UPDATE_ORG_MEMBER:
    post:
      tags:
        - 企业成员
      summary: 企业成员变更通知
      description: |
        **触发条件**：当在页面进行企业成员变更（企业成员的添加或者移除）后触发此回调通知。

        **说明**：
        - 该通知来自 e签宝 全网回调通知服务（lmhlw4nlz46l3ohh）及企业控制台回调通知服务（nq8srh29bhbwzvf1），
          两者推送的字段结构相同，action 值均为 `UPDATE_ORG_MEMBER`。
        - 关于回调接收的通用说明（签名验签、重试机制等），请参阅账号管理回调通知接收说明。
      operationId: onOrgMemberUpdated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - timestamp
                - orgId
                - orgName
                - bizType
                - memberPsnId
                - memberPsnName
              properties:
                action:
                  type: string
                  enum:
                    - UPDATE_ORG_MEMBER
                  description: 通知的业务类型，固定值：`UPDATE_ORG_MEMBER`
                  example: "UPDATE_ORG_MEMBER"
                timestamp:
                  type: integer
                  format: int64
                  description: 回调通知发送时间（如重试多次均返回第一次时间），毫秒级时间戳
                  example: 1730689105399
                orgId:
                  type: string
                  description: 机构账号 ID
                  example: "eb75d38e647d411111edaa7904"
                orgName:
                  type: string
                  description: 机构名称
                  example: "企业测试有限公司"
                bizType:
                  type: integer
                  format: int32
                  enum:
                    - 1
                    - 2
                  description: |
                    变更类型：
                    - `1` - 新增成员
                    - `2` - 删除成员
                  example: 1
                memberPsnId:
                  type: string
                  description: 新增/删除的成员账号 ID
                  example: "c92520ec8111112b34862246bd9b50f"
                memberPsnName:
                  type: string
                  description: 新增/删除的成员姓名
                  example: "李四"
            example:
              orgName: "企业测试有限公司"
              bizType: 1
              memberPsnId: "c92520ec8111112b34862246bd9b50f"
              memberPsnName: "李四"
              orgId: "eb75d38e647d411111edaa7904"
              timestamp: 1730689105399
              action: "UPDATE_ORG_MEMBER"
      responses:
        '200':
          description: 通知接收成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "200"
                  msg:
                    type: string
                    example: "success"
              example:
                code: "200"
                msg: "success"

