          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CommonResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          memberCheck:
                            type: boolean
                            description: |
                              个人用户是否在企业中：
