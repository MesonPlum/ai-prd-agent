        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}
        - {code: 31410044, message: "分页查询印章列表异常，请重试或联系e签宝服务人员"}
        - {code: 1499000, message: "用户未授权： %s（用户id）, %s（scope）"}

  /v3/seals/org-seals/enable-seal:
    post:
      tags: [机构印章]
      summary: 启用机构印章
      operationId: enableOrgSeal
      description: 当印章被停用后，可以通过该接口重新启用印章。启用后，印章变成可用状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, sealId]
              properties:
                orgId: {type: string, description: 机构账号ID}
                sealId: {type: string, description: 印章ID}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
      x-error-codes:
        - {code: 1000000, message: "%s"}
        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}
        - {code: 1435203, message: "账号不存在或已注销 :%s"}
        - {code: 31400100, message: "印章不存在, 印章id=[%s]"}
        - {code: 31400109, message: "印章不属于该账号"}
        - {code: 1499000, message: "用户未授权： %s（用户id）, %s（scope）"}

  /v3/seals/org-seals/disable-seal:
    post:
      tags: [机构印章]
      summary: 停用机构印章
      operationId: disableOrgSeal
      description: 当机构某业务短暂终止时，可将对应印章通过该接口停用，避免后续误用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, sealId]
              properties:
                orgId: {type: string, description: 机构账号ID}
                sealId: {type: string, description: 印章ID}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
      x-error-codes:
        - {code: 1000000, message: "%s"}
        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}
        - {code: 1435203, message: "账号不存在或已注销 :%s"}
        - {code: 31400100, message: "印章不存在, 印章id=[%s]"}
        - {code: 31400109, message: "印章不属于该账号"}
        - {code: 1499000, message: "用户未授权： %s（用户id）, %s（scope）"}

  /v3/seals/org-seals/set-default-seal:
    post:
      tags: [机构印章]
      summary: 设置机构默认印章
      operationId: setOrgDefaultSeal
      description: |
        机构用户在完成实名认证时，e签宝会为企业生成4个印章（包括：公章、合同专用章、财务专用章、人事专用章），
        其中的公章作为企业默认印章，如需更改默认印章，可通过此接口进行设置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, sealId]
              properties:
                orgId: {type: string, description: 机构账号ID}
                sealId: {type: string, description: 新的默认印章ID}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
      x-error-codes:
        - {code: 1000000, message: "%s"}
        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}
        - {code: 31400109, message: "印章不属于该账号"}
        - {code: 31400141, message: "该账号不是企业账号，请使用企业账号。 oid=%s"}
        - {code: 31400137, message: "企业未实名，请先完成企业实名"}
        - {code: 31400100, message: "印章不存在, 印章id=[%s]"}
        - {code: 1499000, message: "用户未授权： %s（用户id）, %s（scope）"}

  # ===== 印章图片上传 =====
  /v3/files/file-key:
    post:
      tags: [印章图片上传]
      summary: 上传印章图片（获取上传地址）
      operationId: getSealImageUploadUrl
      description: |
        用于获取上传印章图片文件的服务端地址 fileUploadUrl 和印章图片 fileKey。
        上传本地印章图片需按顺序两步操作：
        步骤一：调用本接口获取 fileUploadUrl 和 fileKey；
        步骤二：使用 HTTP PUT 将图片二进制流上传至 fileUploadUrl（Content-MD5 与 Content-Type 须与步骤一一致）。
        支持 jpg/jpeg/png/bmp 格式，图片大小需控制在 2M 以内。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentMd5, contentType, fileName, fileSize]
              properties:
                contentMd5:
                  type: string
                  description: 文件的Content-MD5值（128位二进制 Base64 编码）
                contentType:
                  type: string
                  description: 目标文件的MIME类型，固定值 application/octet-stream
                  enum: [application/octet-stream]
                fileName:
                  type: string
                  description: |
                    本地印章图片文件名称（含扩展名）。扩展名只能为 .png/.jpg/.jpeg/.bmp。
                fileSize:
                  type: integer
                  format: int64
                  description: 印章图片大小，单位 byte
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SealImageUploadInfoResponse'
      x-error-codes:
        - {code: 1000000, message: "%s"}
        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}

  # ===== 印章授权 =====
  /v3/seals/org-seals/internal-auth:
    post:
      tags: [印章授权]
      summary: 内部成员印章授权
      operationId: authorizeInternalSeal
      description: |
        企业法定代表人/企业管理员将企业印章授予内部成员相关权限。需要签署《电子印章授权书》或做印章授权意愿认证，接口返回授权操作链接。
        - 被授权成员须确保已加入到印章所属企业组织下；
        - 当需要签署《电子印章授权书》时，开发者可集成返回的授权书签署链接或使用e签宝自带的短信通知；
        - 当需要做印章授权意愿认证时，没有e签宝短信通知，只能开发者应用系统中集成或单独发给企业管理员/法定代表人操作；
        - 授权操作人必须为该企业成员，建议为当前企业管理员或法定代表人；
        - 触发 SEAL_AUTH_EFFICTIVE 回调通知（授权生效时）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalSealAuthRequest'
      responses:
        '200':
          description: 授权操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalSealAuthResponse'
    get:
      tags: [印章授权]
      summary: 查询对内部成员印章授权详情
      operationId: queryInternalSealAuth
      description: |
        查询企业内部的印章授权相关信息。
        - 指定 sealId 查询：查询拥有该印章权限的内部成员等信息；
        - 指定 authorizedPsnId 查询：查询该成员所拥有的所有印章权限；
        - 均不指定时：默认查询企业下所有的印章授权记录。
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string}
          description: 机构账号ID
        - name: sealId
          in: query
          required: false
          schema: {type: string}
          description: 印章ID（印章编号），不传则默认查询全部企业印章
        - name: authorizedPsnId
          in: query
          required: false
          schema: {type: string}
          description: 被授权成员账号ID，不传则默认查询全部企业成员
        - name: pageNum
          in: query
          required: true
          schema: {type: integer, format: int32}
        - name: pageSize
          in: query
          required: true
          schema: {type: integer, format: int32, maximum: 20}
          description: 每页显示数量，最大值：20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalSealAuthDetailResponse'

  /v3/seals/org-seals/external-auth:
    post:
      tags: [印章授权]
      summary: 跨企业印章授权
      operationId: authorizeExternalSeal
      description: |
        委托单位将企业印章授权给外部企业时，接口可用于获取《电子印章跨企业委托使用授权书》的签署链接。
        - 跨企业印章签署的文件所展示的对应签名信息、印章样式和数字证书均为授权企业（委托机构）所有；
        - 适用场景：集团分总企业、关联合作企业等；
        - 自2024-11-20起支持一次授权多个印章（sealIds），旧字段 sealId 已弃用；
        - 触发 SEAL_AUTH_EFFICTIVE 回调通知（授权生效时）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalSealAuthRequest'
      responses:
        '200':
          description: 跨企业授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSealAuthResponse'
    get:
      tags: [印章授权]
      summary: 查询对外部企业印章授权详情
      operationId: queryExternalSealAuth
      description: |
        查询对外部企业的印章授权信息。
        - 指定 sealId 查询：查询该印章所有的跨企业授权信息；
        - 指定 authorizedOrgId 查询：查询对该企业的所有印章授权信息；
        - 同时指定 sealId 和 authorizedOrgId：查询该印章对某企业的授权详情。
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string}
          description: 机构账号ID（委托单位）
        - name: sealId
          in: query
          required: false
          schema: {type: string}
          description: 印章ID（与 authorizedOrgId 至少二选一）
        - name: authorizedOrgId
          in: query
          required: false
          schema: {type: string}
          description: 被授权机构账号ID（与 sealId 至少二选一）
        - name: pageNum
          in: query
          required: true
          schema: {type: integer, format: int32}
        - name: pageSize
          in: query
          required: true
          schema: {type: integer, format: int32, maximum: 20}
          description: 每页显示数量，最大值：20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalSealAuthDetailResponse'

  /v3/seals/org-seals/reauthorization:
    post:
      tags: [印章授权]
      summary: 修改印章授权期限
      operationId: reauthorizeSeal
      description: |
        基于原印章授权（企业内授权或跨企业）所保留的授权业务流程编号（包含已过期的流程），重新修改印章授权的有效期限。
        - 通过接口重新修改授权有效期后，授权操作人需重新签署授权书；
        - 通过接口重新修改授权有效期后，原有保留的授权业务流程编号、授权书签署链接将失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealReauthorizationRequest'
      responses:
        '200':
          description: 修改授权期限成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SealReauthorizationResponse'

  /v3/seals/org-seals/auth-delete:
    post:
      tags: [印章授权]
      summary: 解除印章授权
      operationId: deleteSealAuthorization
      description: |
        解除机构印章的授权（内部成员或跨企业）。
        - 通过印章编号解除授权（deleteType=sealIds）：印章对应内部成员和跨企业的授权将一并解除；
        - 通过业务流程编号解除授权（deleteType=sealAuthBizIds）：可对单方解除授权；
        - 解除成功后会触发 SEAL_AUTH_CALCEL 回调通知。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuthDeleteRequest'
      responses:
        '200':
          description: 解除授权成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'

  /v3/seals/org-seals/authorization-sign-url:
    get:
      tags: [印章授权]
      summary: 查询印章授权书签署链接
      operationId: getSealAuthorizationSignUrl
      description: |
        当原授权书的签署链接失效或未签署完成，可重新获取授权书签署链接。
        支持查询：
        - 印章授权企业内部成员时，《电子签章授权书》的签署链接；
        - 跨企业印章授权时，《电子印章跨企业委托使用授权书》的签署链接。
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string}
          description: 机构账号ID（委托单位）
        - name: sealAuthBizId
          in: query
          required: true
          schema: {type: string}
          description: 授权业务流程编号（通过内部/跨企业授权接口获取）
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SealAuthSignUrlResponse'

  /v3/seals/org-authorized-seal-list:
    get:
      tags: [印章授权]
      summary: 查询被外部企业授权印章
      operationId: listAuthorizedSeals
      description: 查询 orgId（机构企业）名下被外部其他机构企业所授权的印章，包括印章编号、名称、授权机构、印章业务类型、授权失效时间、印章图片下载地址等。
      parameters:
        - name: orgId
          in: query
          required: true
          schema: {type: string}
          description: 被授权方机构账号ID（受托单位）
        - name: authorizerOrgId
          in: query
          required: false
          schema: {type: string}
          description: 授权方机构账号ID（委托单位）
        - name: pageNum
          in: query
          required: true
          schema: {type: integer, format: int32}
        - name: pageSize
          in: query
          required: true
          schema: {type: integer, format: int32, maximum: 20}
          description: 每页显示的数量，最大值：20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedSealListResponse'

# ===== webhooks =====
webhooks:
  SEAL_AUTH_EFFICTIVE:
    post:
      tags: [印章回调]
      summary: 印章授权生效通知
      operationId: onSealAuthEffictive
      description: |
        当印章授权书签署完成或印章授权意愿认证完成后，并到了发起授权时指定的授权生效时间时触发。
        - 含 authorizedPsnId 字段表示内部成员授权；
        - 含 authorizedOrgId 字段表示跨企业授权；
        - 平台批量印章授权时 sealId 返回 CURRENT_ALL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuthEffictivePayload'
      responses:
        '200':
          description: 开发者接收成功，需返回固定字符串 success

  SEAL_AUTH_SIGN:
    post:
      tags: [印章回调]
      summary: 印章授权操作完成通知
      operationId: onSealAuthSign
      description: |
        当印章授权书签署完成或印章授权意愿认证完成后触发。
        注意：印章授权设置的生效时间可能是签署授权书之后的某个时间，所以授权操作完成不代表当前时间已生效。
        2024-11-19 起，原"印章授权书签署完成通知"更名为"印章授权操作完成通知"。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuthSignPayload'
      responses:
        '200':
          description: 开发者接收成功

  SEAL_AUTH_NEARLY_EXPIRED:
    post:
      tags: [印章回调]
      summary: 印章授权即将过期通知
      operationId: onSealAuthNearlyExpired
      description: e签宝在印章授权失效时间提前 7 天和提前 1 天发送此回调。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuthExpirePayload'
      responses:
        '200':
          description: 开发者接收成功

  SEAL_AUTH_INEFFICTIVE:
    post:
      tags: [印章回调]
      summary: 印章授权失效通知
      operationId: onSealAuthInefficitive
      description: 当超过设置的印章授权有效期导致印章授权失效时触发。authStatus 固定为 0。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuthExpirePayload'
      responses:
        '200':
          description: 开发者接收成功

  SEAL_AUTH_CALCEL:
    post:
      tags: [印章回调]
      summary: 解除印章授权通知
      operationId: onSealAuthCancel
      description: 当授权方机构主动解除企业内部成员或跨企业印章授权时触发。authStatus 固定为 2（已删除）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuthExpirePayload'
      responses:
        '200':
          description: 开发者接收成功

  SEAL_AUDIT:
    post:
      tags: [印章回调]
      summary: 图片印章审核结果通知
      operationId: onSealAudit
      description: 创建图片印章后经过 e签宝 人工审核，审核反馈结果时触发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealAuditPayload'
      responses:
        '200':
          description: 开发者接收成功

  SEAL_CREATE:
    post:
      tags: [印章回调]
      summary: 创建印章通知
      operationId: onSealCreate
      description: 印章创建成功后触发，含 psnId 表示个人印章，含 orgId 表示机构印章。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealCreatePayload'
      responses:
        '200':
          description: 开发者接收成功

  SEAL_DELETE:
    post:
      tags: [印章回调]
      summary: 删除印章通知
      operationId: onSealDelete
      description: 印章被删除后触发。sealStatus=delete 表示完全删除（未被使用过），sealStatus=revoke 表示已吊销（用印记录保留）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SealDeletePayload'
      responses:
        '200':
          description: 开发者接收成功

  SIGN_SEAL_EXAMINE_REJECTED:
    post:
      tags: [印章回调]
      summary: 用印审批驳回通知
      operationId: onSignSealExamineRejected
      description: 在签署流程中，某个签署任务需要用印审批，当用印审批被驳回时触发。同一签署任务若有多个印章审批均被驳回则触发多次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignSealExamineRejectedPayload'
      responses:
        '200':
