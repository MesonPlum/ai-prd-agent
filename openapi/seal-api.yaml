# [2026-05-21] | 初始导入 | — | 从 assets/opendoc/seal3/ 忠实导入
# [待升级] 多处不合规项（忠实导入，后续渐进维护）

openapi: 3.1.0
info:
  title: e签宝 印章管理 API
  description: |
    e签宝 SaaS API V3 — 印章管理（个人/机构印章 CRUD、印章授权、印章图片上传、相关回调通知）

    关联 PRD：F-005

    ## 鉴权说明
    所有接口使用 e签宝签名鉴权，请求头需携带 `X-Tsign-Open-App-Id`、
    `X-Tsign-Open-TIMESTAMP`、`X-Tsign-Open-SIGNATURE`、
    `X-Tsign-Open-SIGNATURE-ALGORITHM` 四个请求头。

    ## 权限说明
    - 个人印章接口需用户授权 `manage_psn_resource`；
    - 机构印章接口需企业用户授权 `manage_org_seal`。
  version: "3.0"
  contact:
    name: e签宝开放平台
    url: https://open.esign.cn

servers:
  - url: https://openapi.esign.cn
    description: 正式环境
  - url: https://smlopenapi.esign.cn
    description: 沙箱环境

tags:
  - name: 个人印章
    description: 个人印章的创建（模板/图片）、查询、删除、默认印章设置
  - name: 机构印章
    description: 机构印章的创建（模板/图片/法定代表人）、查询、删除、启停、默认印章设置
  - name: 印章授权
    description: 企业印章的内部成员授权、跨企业授权、授权期限管理、解除授权、授权信息查询
  - name: 印章图片上传
    description: 获取印章图片上传地址，用于本地印章图片创建
  - name: 印章回调
    description: 印章生命周期相关回调通知（创建、删除、审核、授权变更等）

components:
  securitySchemes:
    signatureAuth:
      type: apiKey
      in: header
      name: X-Tsign-Open-App-Id
      description: |
        e签宝请求签名鉴权。请求头需同时携带以下四个字段：
        - `X-Tsign-Open-App-Id`：应用 ID
        - `X-Tsign-Open-TIMESTAMP`：毫秒级时间戳
        - `X-Tsign-Open-SIGNATURE`：签名值（hmac-sha256）
        - `X-Tsign-Open-SIGNATURE-ALGORITHM`：签名算法，固定值 `hmac-sha256`

  schemas:
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 业务码，0表示成功，非0表示异常
        message:
          type: string
          description: 业务信息（请根据 code 判断错误情况，不应依赖 message 匹配）
        data:
          type: object
          nullable: true
          description: 业务数据

    SealIdResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            sealId:
              type: string
              description: 印章ID（开发者需妥善保存印章ID）

    SealColor:
      type: string
      description: 印章颜色。RED-红色，BLUE-蓝色，BLACK-黑色，PURPLE-紫色
      enum: [RED, BLUE, BLACK, PURPLE]

    SealCreateMode:
      type: string
      description: 制章方式。template-按照模板制作印章，file-上传本地图片制作印章
      enum: [template, file]

    PsnSealTemplateStyle:
      type: string
      description: |
        个人模板印章样式：
        RECTANGLE_NO_BORDER-不带边框长方形章；RECTANGLE_BORDER-带边框长方形章；
        SQUARE_LEFT_BORDER-带边框正方形章（左侧字体放大）；SQUARE_RIGHT_BORDER-带边框正方形章（右侧字体放大）；
        SQUARE_LEFT_NO_BORDER-不带边框正方形章（左侧字体放大）；SQUARE_RIGHT_NO_BORDER-不带边框正方形章（右侧字体放大）
      enum:
        - RECTANGLE_NO_BORDER
        - RECTANGLE_BORDER
        - SQUARE_LEFT_BORDER
        - SQUARE_RIGHT_BORDER
        - SQUARE_LEFT_NO_BORDER
        - SQUARE_RIGHT_NO_BORDER

    OrgSealTemplateStyle:
      type: string
      description: |
        机构模板印章样式：
        PUBLIC_ROUND_STAR-圆形公章（带五角星）；PUBLIC_OVAL-椭圆形公章（不带五角星）；PUBLIC_TWO_OVAL-双椭圆形公章（不带五角星）；
        CONTRACT_ROUND_NO_STAR/CONTRACT_ROUND_STAR-合同专用章（圆形）；
        PERSONNEL_ROUND_NO_STAR/PERSONNEL_ROUND_STAR-人事专用章（圆形）；
        FINANCE_ROUND_NO_STAR/FINANCE_ROUND_STAR-财务专用章（圆形）；
        FINANCE_SQUARE_HORIZONTAL/FINANCE_SQUARE_VERTICAL-财务专用章（正方形）；
        COMMON_ROUND_STAR/COMMON_OVAL/COMMON_TWO_OVAL-其他章
      enum:
        - PUBLIC_ROUND_STAR
        - PUBLIC_OVAL
        - PUBLIC_TWO_OVAL
        - CONTRACT_ROUND_NO_STAR
        - CONTRACT_ROUND_STAR
        - PERSONNEL_ROUND_NO_STAR
        - PERSONNEL_ROUND_STAR
        - FINANCE_ROUND_NO_STAR
        - FINANCE_ROUND_STAR
        - FINANCE_SQUARE_HORIZONTAL
        - FINANCE_SQUARE_VERTICAL
        - COMMON_ROUND_STAR
        - COMMON_OVAL
        - COMMON_TWO_OVAL

    SealBizType:
      type: string
      description: 印章业务类型。PUBLIC-公章，CONTRACT-合同专用章,FINANCE-财务专用章，PERSONNEL-人事专用章，LEGAL_PERSON-法定代表人章，COMMON-其他
      enum: [PUBLIC, CONTRACT, FINANCE, PERSONNEL, LEGAL_PERSON, COMMON]

    SealSuffix:
      type: integer
      format: int32
      description: 印章后缀格式。0-无后缀，1-加"印"，2-加"之印"
      enum: [0, 1, 2]
      default: 0

    SealOldStyle:
      type: string
      description: 印章图片做旧。NONE-不做旧，OLD-随机做旧，OLD_1~OLD_12-指定做旧样式
      default: NONE

    # ===== 个人印章相关 schema =====
    PsnSealCreateUrlRequest:
      type: object
      required: [psnId, redirectUrl]
      properties:
        psnId: {type: string, description: 个人账号ID}
        customBizNum:
          type: string
          description: 自定义业务编号，接口不对该参数的值做重复性校验
        sealName:
          type: string
          description: 印章名称（用户自定义，名称不可重复）
        sealCreateMode:
          $ref: '#/components/schemas/SealCreateMode'
        sealTemplateStyle:
          $ref: '#/components/schemas/PsnSealTemplateStyle'
        sealSize:
          type: string
          description: 个人印章尺寸（毫米mm），格式 宽_高。长方形固定 20_10；正方形固定 20_20/18_18/16_16
        sealColor:
          $ref: '#/components/schemas/SealColor'
        sealSuffix:
          $ref: '#/components/schemas/SealSuffix'
        sealOpacity:
          type: integer
          format: int32
          minimum: 20
          maximum: 100
          default: 80
          description: 印章不透明度（默认80），取值 20-100，100 表示不透明
        redirectUrl:
          type: string
          description: 重定向地址（http/https，app 场景支持 appScheme 格式）
        uneditableFields:
          type: array
          items: {type: string}
          description: |
            页面中不可编辑的字段：sealCreateMode/sealName/sealSuffix/
            sealTemplateStyle/sealSize/sealColor/sealOpacity

    PsnSealCreateUrlResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            psnSealCreateUrl:
              type: string
              description: 创建个人印章页面链接（有效期30分钟）

    PsnSealManageUrlResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            psnSealManageUrl:
              type: string
              description: 个人印章管理页面链接（有效期30分钟）

    PsnSealCreateByTemplateRequest:
      type: object
      required: [psnId, sealName, sealTemplateStyle, sealSize]
      properties:
        psnId: {type: string, description: 个人账号ID}
        sealName: {type: string, description: 印章名称（用户自定义，且名称不可重复）}
        sealTemplateStyle:
          $ref: '#/components/schemas/PsnSealTemplateStyle'
        sealSize:
          type: string
          description: 个人印章尺寸（毫米mm），格式 宽_高
        sealColor:
          $ref: '#/components/schemas/SealColor'
        sealSuffix:
          $ref: '#/components/schemas/SealSuffix'
        sealOpacity:
          type: integer
          format: int32
          minimum: 20
          maximum: 100
          default: 80
        sealOldStyle:
          $ref: '#/components/schemas/SealOldStyle'

    PsnSealCreateByImageRequest:
      type: object
      required: [psnId, sealImageFileKey, sealName, sealWidth, sealHeight]
      properties:
        psnId: {type: string, description: 个人账号ID}
        sealImageFileKey:
          type: string
          description: 印章图片的 fileKey，由【上传印章图片】接口获取
        sealName: {type: string, description: 印章名称（不可重复）}
        sealWidth:
          type: integer
          format: int32
          maximum: 100
          description: 印章宽度（mm），上限 100
        sealHeight:
          type: integer
          format: int32
          maximum: 100
          description: 印章高度（mm），上限 100
        sealColor:
          $ref: '#/components/schemas/SealColor'
        manualAudit:
          type: boolean
          default: false
          description: 是否直接走 e签宝人工审核（true 时必须传 sealFilingMaterials）
        sealFilingMaterials:
          type: array
          items: {type: string}
          description: 印章备案材料 fileKey，支持 jpg/jpeg/png/bmp/doc/pdf，单文件 ≤2M

    PsnSealInfo:
      type: object
      properties:
        sealId: {type: string, description: 印章ID}
        sealName: {type: string, description: 印章名称}
        sealCreateTime:
          type: integer
          format: int64
          description: 印章创建时间（Unix 毫秒时间戳）
        defaultSealFlag:
          type: boolean
          description: 是否为个人默认印章
        sealHeight: {type: integer, format: int32, description: 印章高度（mm）}
        sealWidth: {type: integer, format: int32, description: 印章宽度（mm）}
        sealStyle:
          type: integer
          format: int32
          description: 印章制作方式。2-个人模板印章，3-图片印章，4-个人手绘印章
        sealStatus:
          type: integer
          format: int32
          description: 印章状态。1-已启用，2-待审核，3-审核不通过
        statusDescription: {type: string, description: 印章状态描述}
        rejectReason: {type: string, description: 审核不通过原因}
        sealImageDownloadUrl:
          type: string
          description: 印章图片（带水印）下载地址（有效期60分钟）

    PsnSealInfoResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/PsnSealInfo'

    PsnSealListResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            total:
              type: integer
              format: int64
              description: 查询印章记录条数
            seals:
              type: array
              items:
                $ref: '#/components/schemas/PsnSealInfo'

    # ===== 机构印章相关 schema =====
    OrgSealCreateUrlRequest:
      type: object
      required: [orgId, transactorPsnId, redirectUrl]
      properties:
        orgId: {type: string, description: 机构账号ID}
        transactorPsnId:
          type: string
          description: 经办人个人账号ID，需在该机构成员中并拥有印章管理权限
        customBizNum:
          type: string
          description: 自定义业务编号，接口不对该参数的值做重复性校验
        sealName: {type: string, description: 机构印章名称（不可重复）}
        sealCreateMode:
          $ref: '#/components/schemas/SealCreateMode'
        sealTemplateStyle:
          $ref: '#/components/schemas/OrgSealTemplateStyle'
        sealSize:
          type: string
          description: 机构印章尺寸（毫米mm），格式 宽_高，按所选模板样式取值
        sealColor:
          $ref: '#/components/schemas/SealColor'
        sealSuffix:
          type: string
          description: 印章后缀（不对外，内部字段）
        sealOpacity:
          type: integer
          format: int32
          minimum: 20
          maximum: 100
          default: 80
        sealHorizontalText:
          type: string
          description: 印章横排文字（不对外，内部字段）
        sealBottomText:
          type: string
          description: 印章底部文字（不对外，内部字段）
        sealOutsideSurroundText:
          type: string
          description: 印章外圈环绕文字（不对外，内部字段）
        redirectUrl:
          type: string
          maxLength: 1024
          description: 重定向地址（https），不超过 1024 个字符
        uneditableFields:
          type: array
          items: {type: string}
          description: |
            页面中不可编辑的字段：sealCreateMode/sealName/sealTemplateType/
            sealTemplateStyle/sealSize/sealColor/sealOpacity/sealSuffix/
            sealHorizontalText/sealBottomText/sealOutsideSurroundText

    OrgSealCreateUrlResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            orgSealCreateUrl:
              type: string
              description: 创建机构印章页面链接（有效期30分钟）

    LegalRepSealCreateUrlRequest:
      type: object
      required: [orgId, transactorPsnId, redirectUrl]
      properties:
        orgId: {type: string, description: 机构账号ID}
        transactorPsnId:
          type: string
          description: 经办人个人账号ID（建议由法定代表人本人操作）
        customBizNum: {type: string, description: 自定义业务编号}
        sealName: {type: string, description: 法定代表人印章名称（不可重复）}
        sealCreateMode:
          $ref: '#/components/schemas/SealCreateMode'
        sealTemplateStyle:
          $ref: '#/components/schemas/PsnSealTemplateStyle'
        sealSize:
          type: string
          description: 印章尺寸（毫米mm），长方形 20_10；正方形 20_20/18_18/16_16
        sealColor:
          $ref: '#/components/schemas/SealColor'
        sealOpacity:
          type: integer
          format: int32
          minimum: 20
          maximum: 100
          default: 80
        redirectUrl:
          type: string
          maxLength: 1024
        uneditableFields:
          type: array
          items: {type: string}

    LegalRepSealCreateUrlResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            legalRepSealCreateUrl:
              type: string
              description: 创建机构法定代表人印章页面链接(有效期30分钟)

    OrgSealManageUrlResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            orgSealManageUrl:
              type: string
              description: 机构印章管理页面链接（有效期30分钟）

    OrgSealCreateByTemplateRequest:
      type: object
      required: [orgId, sealName, sealTemplateStyle, sealSize]
      properties:
        orgId: {type: string, description: 机构账号ID}
        sealName: {type: string, description: 机构印章名称（不可重复）}
        sealTemplateStyle:
          $ref: '#/components/schemas/OrgSealTemplateStyle'
        sealSize:
          type: string
          description: 机构印章尺寸（毫米mm），格式 宽_高
        sealColor:
          $ref: '#/components/schemas/SealColor'
        sealOpacity:
          type: integer
          format: int32
          minimum: 20
          maximum: 100
          default: 80
        sealOldStyle:
          $ref: '#/components/schemas/SealOldStyle'
        sealHorizontalText:
          type: string
          maxLength: 30
          description: 自定义印章横向文，示例 "XX专用章"，最多 30 个字符
        sealBottomText:
          type: string
          maxLength: 30
          description: 印章下弦文（实体印章防伪码），仅英文/英文符号，最多 30 个字符
        sealOutsideSurroundText:
          type: string
          maxLength: 50
          description: 印章环绕文（英文），双椭圆公章外侧文字，仅英文/英文符号，最多 50 个字符

    OrgSealCreateByImageRequest:
      type: object
      required: [orgId, sealImageFileKey, sealName, sealWidth, sealHeight]
      properties:
        orgId: {type: string, description: 机构账号ID}
        sealImageFileKey:
          type: string
          description: 印章图片的 fileKey，由【上传印章图片】接口获取
        sealName: {type: string, description: 印章名称（不可重复）}
        sealWidth:
          type: integer
          format: int32
          maximum: 100
          description: 印章宽度（mm），上限 100
        sealHeight:
          type: integer
          format: int32
          maximum: 100
          description: 印章高度（mm），上限 100
        sealColor:
          $ref: '#/components/schemas/SealColor'
        sealBizType:
          $ref: '#/components/schemas/SealBizType'
        imageProcess:
          type: boolean
          default: true
          description: 是否对图片做背景处理（抠图与颜色绘制），默认 true
        manualAudit:
          type: boolean
          default: false
          description: 是否直接走 e签宝人工审核（true 时必须传 sealFilingMaterials）
        sealFilingMaterials:
          type: array
          items: {type: string}
          description: 印章备案材料 fileKey，支持 jpg/jpeg/png/bmp/doc/pdf，单文件 ≤2M

    OrgSealDeleteResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            sealStatus:
              type: string
              description: 删除印章状态。delete-已删除（未被使用过，完全删除）；revoke-已吊销（被使用过，用印记录保留）
              enum: [delete, revoke]

    OrgSealInfo:
      type: object
      properties:
        sealId: {type: string, description: 印章ID（印章编号）}
        sealName: {type: string, description: 印章名称}
        sealCreateTime:
          type: integer
          format: int64
          description: 印章创建时间（Unix 毫秒时间戳）
        defaultSealFlag:
          type: boolean
          description: 是否为机构默认印章
        sealHeight: {type: integer, format: int32, description: 印章高度（mm）}
        sealWidth: {type: integer, format: int32, description: 印章宽度（mm）}
        sealBizType:
          $ref: '#/components/schemas/SealBizType'
        sealBizTypeDescription:
          type: string
          description: 印章业务类型说明
        sealStyle:
          type: integer
          format: int32
          description: 印章制作方式。1-机构模板章，3-图片印章（上传本地文件）
        sealStatus:
          type: integer
          format: int32
          description: |
            印章状态。1-已启用，2-待审核，3-审核不通过，
            4-挂起或已停用（挂起仅限法人/管理员更换后未重新授权的法定代表人章状态），
            6-已吊销（有用印记录的印章删除后）
        statusDescription: {type: string, description: 印章状态描述}
        rejectReason: {type: string, description: 图片印章审核不通过原因}
        sealImageDownloadUrl:
          type: string
          description: 印章图片（带水印）下载地址（有效期60分钟）

    OrgSealInfoResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          $ref: '#/components/schemas/OrgSealInfo'

    OrgSealListResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            total:
              type: integer
              format: int64
              description: 查询印章总数
            seals:
              type: array
              items:
                $ref: '#/components/schemas/OrgSealInfo'

    SealImageUploadInfoResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            fileKey:
              type: string
              description: 印章图片的 fileKey（开发者需妥善保存，可用于创建图片印章）
            fileUploadUrl:
              type: string
              description: 印章图片服务端上传地址，链接有效期 60 分钟

    # ===== 印章授权相关 schema =====
    InternalSealAuthRequest:
      type: object
      required: [orgId, sealId, authorizedPsnIds, sealRole, transactorPsnId, sealAuthScope]
      properties:
        orgId:
          type: string
          description: 机构账号ID
        sealId:
          type: string
          description: 授权印章ID（企业印章编号）
        authorizedPsnIds:
          type: array
          items:
            type: string
          description: |
            指定被授权成员（账号ID或ALL）：
            - 被授权人账号ID列表（最多10个）；
            - ALL - 授权全部企业成员（此时 sealRole 只能是 SEAL_USER）。
        sealRole:
          type: string
          enum: [SEAL_USER, SEAL_EXAMINER]
          description: |
            印章角色：
            SEAL_USER - 印章使用员；
            SEAL_EXAMINER - 印章审批员（含用印审批权限）。
        transactorPsnId:
          type: string
          description: 授权操作人账号ID（建议为企业管理员或法定代表人）
        sealAuthScope:
          type: object
          description: 授权印章使用范围（templateIds 和 applicationsIds 必须二选一）
          properties:
            templateIds:
              type: array
              items: {type: string}
              description: 授权的企业模板编号列表（模板编号或ALL），最多10个
            applicationsIds:
              type: array
              items: {type: string}
              description: 授权的开发者应用ID列表（appId）
        autoSign:
          type: boolean
          default: false
          description: |
            印章是否设置自动落章。
            (1) 必须授权全部企业成员且指定具体模板编号；
            (2) 仅限《流程模板签署服务API》和官网模板发起签署使用；
            (3) 同一模板只能授权对应企业下某一个印章自动落章。
        longTermEffective:
          type: boolean
          default: false
          description: 是否长期有效（true 时不能再传 effectiveTime/expireTime）
        effectiveTime:
          type: integer
          format: int64
          description: 授权生效时间（毫秒时间戳，longTermEffective=false 时必传）
        expireTime:
          type: integer
          format: int64
          description: 授权失效时间（毫秒时间戳，最长不超过3年，longTermEffective=false 时必传）
        authConfirmMethod:
          type: integer
          format: int32
          default: 1
          enum: [0, 1]
          description: |
            授权确认方式：
            0 - 意愿认证授权（管理员/法人刷脸）；
            1 - 签署授权书授权（默认）。
        redirectUrl:
          type: string
          description: 授权完成后重定向跳转地址
        customBizNum:
          type: string
          description: 自定义业务编号
        appScheme:
          type: string
          description: 开发者 app-Scheme 地址，支付宝刷脸后跳回开发者 app

    InternalSealAuthResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            sealAuthBizIds:
              type: array
              items: {type: string}
              description: 授权业务流程编号列表
            sealAuthBizInfos:
              type: array
              items:
                type: object
                properties:
                  authorizedPsnId: {type: string}
                  sealAuthBizId: {type: string}
            authorizationSignShortUrl:
              type: string
              description: 授权书签署短链接（有效期180天）
            authorizationSignUrl:
              type: string
              description: 授权书签署长链接（永久有效）
            sealAuthorizeType:
              type: integer
              description: 授权操作人企业成员角色（1-管理员/法定代表人；2-普通成员）

    ExternalSealAuthRequest:
      type: object
      required: [orgId, sealIds, transactorPsnId, authorizedOrgInfo]
      properties:
        orgId:
          type: string
          description: 机构账号ID（委托机构）
        sealIds:
          type: array
          items: {type: string}
          description: 授权印章ID列表（含法定代表人印章）
        sealId:
          type: string
          deprecated: true
          description: 授权印章ID（旧版，2024-11-20 起弃用）
        transactorPsnId:
          type: string
          description: 授权操作人账号ID（委托机构的法人或管理员）
        authorizedOrgInfo:
          type: object
          required: [orgName, orgIDCardNum]
          properties:
            orgName: {type: string, description: 被授权机构名称}
            orgIDCardNum: {type: string, description: 被授权机构证件号（统一社会信用代码 或 工商注册号）}
        longTermEffective:
          type: boolean
          default: false
        effectiveTime:
          type: integer
          format: int64
        expireTime:
          type: integer
          format: int64
        authorizedType:
          type: integer
          format: int32
          default: 0
          enum: [0, 1]
          description: |
            授权印章使用对象：
            0 - 被授权企业的管理员/法定代表人（不限应用ID）；
            1 - 被授权企业下的应用（必须配合 applicationsId）。
        applicationsId:
          type: string
          description: 被授权企业下的开发者应用ID（authorizedType=1 时必传）
        redirectUrl:
          type: string
        appScheme:
          type: string
        customBizNum:
          type: string
          description: 自定义业务编号
        autoSign:
          type: boolean
          default: false
          description: 印章是否设置自动落章（仅限授权全部企业成员且指定具体模板编号时使用）

    ExternalSealAuthResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            authorizationSignShortUrl:
              type: string
              description: 授权书签署短链（有效期180天）
            authorizationSignUrl:
              type: string
              description: 授权书签署长链（永久有效）
            sealAuthBizIds:
              type: array
              items:
                type: object
                properties:
                  sealId: {type: string}
                  sealAuthBizId: {type: string}
            sealAuthBizId:
              type: string
              deprecated: true
              description: 授权业务流程编号（旧版，2024-11-20 起改用 sealAuthBizIds 数组）

    SealReauthorizationRequest:
      type: object
      required: [orgId, transactorPsnId, sealAuthBizId]
      properties:
        orgId: {type: string}
        transactorPsnId:
          type: string
          description: 授权操作人账号ID（法定代表人或管理员）
        sealAuthBizId:
          type: string
          description: 原授权业务流程编号
        longTermEffective:
          type: boolean
          default: false
        effectiveTime:
          type: integer
          format: int64
        expireTime:
          type: integer
          format: int64
        redirectUrl:
          type: string
          maxLength: 1024
        appScheme:
          type: string

    SealReauthorizationResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            newSealAuthBizId:
              type: string
              description: 新的授权业务流程编号
            authorizationSignShortUrl:
              type: string
              description: 授权书签署短链接（有效期30天）
            authorizationSignUrl:
              type: string
              description: 授权书签署长链接

    SealAuthDeleteRequest:
      type: object
      required: [orgId, deleteType]
      properties:
        orgId:
          type: string
          description: 机构账号ID（委托单位）
        deleteType:
          type: string
          enum: [sealIds, sealAuthBizIds]
          description: |
            解除授权方式：
            sealIds - 按印章解除；
            sealAuthBizIds - 按授权业务流程编号解除。
        sealIds:
          type: array
          items: {type: string}
          maxItems: 20
          description: 印章ID列表（deleteType=sealIds 时必传）
        sealAuthBizIds:
          type: array
          items: {type: string}
          maxItems: 20
          description: 授权业务流程编号列表（deleteType=sealAuthBizIds 时必传）

    SealAuthSignUrlResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            authorizationSignShortUrl:
              type: string
              description: 短链接（有效期180天）
            authorizationSignUrl:
              type: string
              description: 长链接（永久有效）

    AuthorizedSealInfo:
      type: object
      properties:
        sealId: {type: string}
        authorizerOrgId: {type: string}
        authorizerOrgName: {type: string}
        sealAuthBizId: {type: string}
        sealName: {type: string}
        sealBizType:
          type: string
          enum: [PUBLIC, CONTRACT, FINANCE, PERSONNEL, LEGAL_PERSON, COMMON]
        sealBizTypeDescription: {type: string}
        sealStyle:
          type: integer
          format: int32
          description: 制作方式（1-机构模板章；3-图片印章）
        effectiveTime:
          type: integer
          format: int64
        expireTime:
          type: integer
          format: int64
        sealImageDownloadUrl:
          type: string
          description: 印章图片（带水印）下载地址（60分钟有效）
        sealHeight: {type: integer, format: int32}
        sealWidth: {type: integer, format: int32}

    AuthorizedSealListResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            total:
              type: integer
              format: int64
            seals:
              type: array
              items:
                $ref: '#/components/schemas/AuthorizedSealInfo'

    ExternalSealAuthDetailInfo:
      type: object
      properties:
        sealId: {type: string}
        authorizerPsnId: {type: string}
        authorizedOrgId: {type: string}
        sealAuthBizId: {type: string}
        authorizeStatus:
          type: integer
          format: int32
          enum: [0, 1, 3]
          description: 0-失效；1-正常；3-待生效
        statusDescription: {type: string}
        expireReason:
          type: string
          enum: [NOT_EXPIRE, NOT_SIGN, WAIT_EFFECTIVE, EXPIRED, GRANT_ORG_ACCOUNT_UPDATE, GRANTER_ACCOUNT_UPDATE, GRANTED_ACCOUNT_UPDATE]
        expireReasonDescription: {type: string}
        longTermEffective: {type: boolean}
        effectiveTime: {type: integer, format: int64}
        expireTime: {type: integer, format: int64}
        signFlowId: {type: string}
        authorizedType:
          type: integer
          format: int32
          enum: [0, 1]
        authorizedApplication:
          type: string
          nullable: true

    ExternalSealAuthDetailResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            total: {type: integer, format: int32}
            sealAuthorizedInfos:
              type: array
              items:
                $ref: '#/components/schemas/ExternalSealAuthDetailInfo'

    InternalSealAuthDetailInfo:
      type: object
      properties:
        sealId: {type: string}
        sealAuthBizId: {type: string}
        authorizerPsnId: {type: string}
        authorizedPsnId:
          type: string
          description: 被授权成员账号ID，可能为 ALL
        sealRole:
          type: string
          enum: [SEAL_EXAMINER, SEAL_USER]
        authorizeStatus:
          type: integer
          format: int32
          enum: [0, 1, 3]
        statusDescription: {type: string}
        expireReason:
          type: string
          enum: [NOT_EXPIRE, NOT_SIGN, WAIT_EFFECTIVE, EXPIRED, GRANT_ORG_ACCOUNT_UPDATE, GRANTER_ACCOUNT_UPDATE, GRANTED_ACCOUNT_UPDATE]
        expireReasonDescription: {type: string}
        longTermEffective: {type: boolean}
        effectiveTime: {type: integer, format: int64}
        expireTime: {type: integer, format: int64}
        signFlowId: {type: string}
        sealAuthScope:
          type: object
          properties:
            template:
              type: object
              properties:
                templateId:
                  type: string
                  description: 模板编号或 ALL
                applicationsIds:
                  type: string
                  nullable: true
            autoSign: {type: boolean}

    InternalSealAuthDetailResponse:
      type: object
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data:
          type: object
          properties:
            total: {type: integer, format: int32}
            sealAuthorizedInfos:
              type: array
              items:
                $ref: '#/components/schemas/InternalSealAuthDetailInfo'

    # ===== webhook payload schema =====
    SealAuthEffictivePayload:
      type: object
      required: [action, sealAuthType, sealId, sealAuthBizId, authStatus, authorizerOrgId, bodyVersion, effectiveTime, expireTime]
      properties:
        action: {type: string, enum: [SEAL_AUTH_EFFICTIVE]}
        sealAuthType:
          type: string
          enum: [SINGLE_SEAL, PLATFORM_BATCH]
        sealId:
          type: string
          description: 印章ID（PLATFORM_BATCH 时返回 CURRENT_ALL）
        sealAuthBizId:
          type: string
          description: 授权业务流程编号/认证授权流程ID（authFlowId）
        authStatus:
          type: string
          description: 1-生效；0-失效；2-已删除；3-待生效（此通知固定为1）
        authorizerOrgId: {type: string}
        authorizedPsnId:
          type: string
          description: 仅企业内部成员授权时返回
        authorizedOrgId:
          type: string
          description: 仅跨企业授权时返回
        bodyVersion: {type: string, default: V3}
        effectiveTime: {type: integer, format: int64}
        expireTime: {type: integer, format: int64}

    SealAuthSignPayload:
      type: object
      required: [action, sealId, sealAuthBizId, authStatus, authConfirmMethod, sealAuthType, authorizerOrgId, bodyVersion, effectiveTime, expireTime, signFlowId]
      properties:
        action: {type: string, enum: [SEAL_AUTH_SIGN]}
        sealId: {type: string}
        sealAuthBizId: {type: string}
        authStatus:
          type: integer
          format: int32
          enum: [0, 1, 2, 3]
        authConfirmMethod:
          type: integer
          format: int32
          enum: [0, 1]
          description: 0-意愿认证授权（仅内部成员授权）；1-签署授权书授权
        sealAuthType:
          type: string
          enum: [SINGLE_SEAL, PLATFORM_BATCH]
        authorizerOrgId: {type: string}
        authorizedPsnId: {type: string}
        authorizedOrgId: {type: string}
        bodyVersion: {type: string}
        effectiveTime: {type: integer, format: int64}
        expireTime: {type: integer, format: int64}
        signFlowId: {type: string}

    SealAuthExpirePayload:
      type: object
      description: 用于 SEAL_AUTH_NEARLY_EXPIRED / SEAL_AUTH_INEFFICTIVE / SEAL_AUTH_CALCEL 三类通知
      required: [action, sealAuthType, sealId, sealAuthBizId, authStatus, authorizerOrgId, bodyVersion, effectiveTime, expireTime]
      properties:
        action:
          type: string
          enum: [SEAL_AUTH_NEARLY_EXPIRED, SEAL_AUTH_INEFFICTIVE, SEAL_AUTH_CALCEL]
        sealAuthType:
          type: string
          enum: [SINGLE_SEAL, PLATFORM_BATCH]
        sealId: {type: string}
        sealAuthBizId: {type: string}
        authStatus:
          type: string
          description: NEARLY_EXPIRED 固定1；INEFFICTIVE 固定0；CALCEL 固定2
        authorizerOrgId: {type: string}
        authorizedPsnId: {type: string}
        authorizedOrgId: {type: string}
        bodyVersion: {type: string}
        effectiveTime: {type: integer, format: int64}
        expireTime: {type: integer, format: int64}

    SealAuditPayload:
      type: object
      required: [action, sealId, sealName, auditStatus, statusDescription, bodyVersion]
      properties:
        action: {type: string, enum: [SEAL_AUDIT]}
        sealId: {type: string}
        sealName: {type: string}
        auditStatus:
          type: string
          enum: ["0", "1"]
          description: 1-通过；0-驳回
        statusDescription: {type: string}
        customBizNum: {type: string}
        rejectReason: {type: string}
        psnId: {type: string}
        orgId: {type: string}
        sealBizType:
          type: string
          enum: [PUBLIC, CONTRACT, FINANCE, LEGAL_PERSON, COMMON]
        bodyVersion: {type: string}

    SealCreatePayload:
      type: object
      required: [action, sealId, sealName, sealCreateMode, bodyVersion]
      properties:
        action: {type: string, enum: [SEAL_CREATE]}
        sealId: {type: string}
        customBizNum: {type: string}
        sealName: {type: string}
        sealCreateMode:
          type: string
          enum: [template, file, hand-draw]
        psnId: {type: string}
        orgId: {type: string}
        sealBizType:
          type: string
          enum: [PUBLIC, CONTRACT, PERSONNEL, FINANCE, LEGAL_PERSON, COMMON]
        bodyVersion: {type: string}

    SealDeletePayload:
      type: object
      required: [action, sealId, sealName, sealCreateMode, bodyVersion, sealStatus]
      properties:
        action: {type: string, enum: [SEAL_DELETE]}
        sealId: {type: string}
        sealName: {type: string}
        sealCreateMode:
          type: string
          enum: [template, file, hand-draw]
        psnId: {type: string}
        orgId: {type: string}
        sealBizType:
          type: string
          enum: [PUBLIC, CONTRACT, FINANCE, PERSONNEL, LEGAL_PERSON, COMMON]
        bodyVersion: {type: string}
        sealStatus:
          type: string
          enum: [delete, revoke]
          description: delete-完全删除（未被使用过）；revoke-已吊销（用印记录保留）

    SignSealExamineRejectedPayload:
      type: object
      required: [action, timestamp, signFlowId, signOrder, rejectTime, rejectDescription, rejecter, operator]
      properties:
        action: {type: string, enum: [SIGN_SEAL_EXAMINE_REJECTED]}
        timestamp: {type: integer, format: int64}
        signFlowId: {type: string}
        signOrder: {type: integer}
        rejectTime: {type: integer, format: int64}
        rejectDescription: {type: string}
        rejecter:
          $ref: '#/components/schemas/SealAuditOperator'
        operator:
          $ref: '#/components/schemas/SealAuditOperator'
        organization:
          type: object
          properties:
            orgId: {type: string}
            orgName: {type: string}

    SealAuditOperator:
      type: object
      properties:
        psnId: {type: string}
        psnAccount:
          type: object
          properties:
            accountMobile: {type: string}
            accountEmail: {type: string}

security:
  - signatureAuth: []

paths:
  # ===== 个人印章 =====
  /v3/seals/psn-seal-create-url:
    post:
      tags: [个人印章]
      summary: 获取创建个人印章页面链接
      operationId: getPsnSealCreateUrl
      description: |
        提供可视化的页面（免登录），由个人用户选择印章的样式、内容等，创建个人印章。
        - 开发者可预设置印章的样式等其他参数，若不指定则可由用户在页面中选择。
        - 接口用于获取制作个人印章的页面地址，支持开发者将地址集成到内部系统当中访问。
        - 通过页面印章创建成功后，e签宝将会向开发者推送【创建印章通知】。
        前置条件：必须确保个人用户已授予平台appId获取其印章资源管理权限（manage_psn_resource）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PsnSealCreateUrlRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PsnSealCreateUrlResponse'
      x-error-codes:
        - {code: 1435203, message: "账号不存在或已注销 :%s"}
        - {code: 10000007, message: "参数错误 :%s"}

  /v3/seals/psn-seals-manage-url:
    post:
      tags: [个人印章]
      summary: 获取管理个人印章页面链接
      operationId: getPsnSealManageUrl
      description: |
        通过可视化页面（免登录）来操作管理个人印章。
        支持查看个人印章列表、创建印章、删除印章、设置默认印章、修改印章名称等操作。
        前置条件：必须确保个人用户已授予平台appId获取其印章资源管理权限（manage_psn_resource）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [psnId]
              properties:
                psnId:
                  type: string
                  description: 个人账号ID。用户在e签宝注册实名后才有账号ID。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PsnSealManageUrlResponse'
      x-error-codes:
        - {code: 1000000, message: "%s"}
        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}

  /v3/seals/psn-seals/create-by-template:
    post:
      tags: [个人印章]
      summary: 创建个人模板印章
      operationId: createPsnSealByTemplate
      description: |
        使用e签宝提供的模板样式来制作个人印章。
        印章中的姓名为个人用户已实名认证的真实姓名。
        印章创建成功后，e签宝将会向开发者推送【创建印章通知】。
        前置条件：必须确保个人用户已授予平台appId获取其印章资源管理权限（manage_psn_resource）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PsnSealCreateByTemplateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SealIdResponse'
      x-error-codes:
        - {code: 1000000, message: "%s / 同样样式的印章已存在，sealId：%s"}
        - {code: 10000001, message: "系统异常，请重试或联系e签宝服务人员"}
        - {code: 10000007, message: "参数错误 :%s"}
        - {code: 31400142, message: "该账号不是个人账号，请使用个人账号。 oid=%s"}
        - {code: 31400131, message: "个人未实名，请先完成个人实名"}
