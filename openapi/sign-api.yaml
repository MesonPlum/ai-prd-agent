openapi: 3.1.0
info:
  title: e签宝 合同签署 API
  description: |
    e签宝 SaaS API V3 — 合同签署服务（含发起、查询、下载、出证、解约、验签）

    关联 PRD：F-003

    ## 模块覆盖范围
    - 签署发起（基于文件 / 通过页面 / 批量签）
    - 文件操作（上传、追加待签文件、附属材料、签署区、关键字坐标检索）
    - 流程查询（流程详情/列表、集成方企业流程、审批流程）
    - 文件下载（签署中预览文件、已签署文件及附属材料）
    - 流程操作（催签、延期、完结、撤销）
    - 出证（申请出证、查询出证、区块链存证）
    - 验签（PDF 签名核验、异步验签结果）
    - 解约（API 发起解约、页面发起解约）
    - 模板填写（基于模板生成文件、查询填写任务）
    - OFD 文件处理

    ## 鉴权说明
    所有接口使用 e签宝签名鉴权，请求头需携带 `X-Tsign-Open-App-Id`、
    `X-Tsign-Open-TIMESTAMP`、`X-Tsign-Open-SIGNATURE`、
    `X-Tsign-Open-SIGNATURE-ALGORITHM` 四个请求头。

    ## 主要错误码（1435 段为签署服务专属）
    - 1435001：流程不存在或无权限
    - 1435002：参数错误（含 ~80 类细分场景，详见各接口 x-error-codes）
    - 1435003：业务规则冲突（如流程状态不允许操作）
    - 1435011：自动签 / 自动开启配置错误
    - 1435203：账号不存在或已注销
    - 1435999：内部服务异常
    - 401 / 403：鉴权失败 / IP 白名单不匹配
  version: "3.0"
  contact:
    name: e签宝开放平台
    url: https://open.esign.cn

servers:
  - url: https://openapi.esign.cn
    description: 正式环境
  - url: https://smlopenapi.esign.cn
    description: 沙箱环境

tags:
  - name: 签署发起
    description: 基于文件发起签署、通过页面发起、批量签等
  - name: 文件操作
    description: 文件上传、追加待签文件、附属材料、关键字坐标
  - name: 签署区与定位
    description: 追加/删除签署区、拖章定位页面
  - name: 页面链接
    description: 签署页面链接、用印审批页面链接
  - name: 签署流程查询
    description: 流程详情、流程列表、集成方企业流程列表
  - name: 审批流程查询
    description: 审批流程详情、审批流程列表
  - name: 文件下载
    description: 签署中预览文件、已签署文件及附属材料下载
  - name: 模板填写文件查询
    description: HTML/PDF 模板填写后文件查询
  - name: 流程操作
    description: 催签、延期、完结、撤销
  - name: 出证
    description: 申请出证、查询出证流程、区块链存证
  - name: 验签
    description: 合同文件签名有效性核验、异步验签
  - name: 解约
    description: API 发起解约、页面发起解约
  - name: 模板填写
    description: 基于模板填充生成文件、查询填写任务结果
  - name: OFD文件处理
    description: OFD 文件合并等
  - name: 签署回调
    description: 签署流程相关回调通知（发起结果、签署完成、已读、转交、加密完成等）
  - name: 审批回调
    description: 审批流程相关回调通知
  - name: 解约回调
    description: 解约发起、解约成功通知
  - name: 出证回调
    description: 异步出证完成通知

components:
  securitySchemes:
    signatureAuth:
      type: apiKey
      in: header
      name: X-Tsign-Open-App-Id
      description: |
        e签宝请求签名鉴权。请求头需同时携带四个字段：
        - `X-Tsign-Open-App-Id`：应用 ID
        - `X-Tsign-Open-TIMESTAMP`：毫秒级时间戳
        - `X-Tsign-Open-SIGNATURE`：签名值（hmac-sha256）
        - `X-Tsign-Open-SIGNATURE-ALGORITHM`：签名算法，固定值 `hmac-sha256`

  schemas:
    # ===== 通用响应 =====
    CommonResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 业务码，0 表示成功，非 0 表示异常
        message:
          type: string
          description: 业务信息（请根据 code 判断错误情况，不应依赖 message 匹配）
        data:
          type: object
          nullable: true
          description: 业务数据

    EmptyDataResponse:
      type: object
      properties:
        code: { type: integer, format: int32 }
        message: { type: string }
        data:
          type: object
          nullable: true

    PsnAccount:
      type: object
      properties:
        accountMobile: { type: string, description: 手机号（账号标识） }
        accountEmail: { type: string, description: 邮箱（账号标识） }

    PsnIDCardType:
      type: string
      enum: [CRED_PSN_CH_IDCARD, CRED_PSN_CH_HONGKONG, CRED_PSN_CH_MACAO, CRED_PSN_CH_TWCARD, CRED_PSN_PASSPORT, CRED_PSN_CH_GREEN_CARD]
      description: |
        个人证件类型：
        CRED_PSN_CH_IDCARD-中国大陆居民身份证（默认）；
        CRED_PSN_CH_HONGKONG-香港回乡证；
        CRED_PSN_CH_MACAO-澳门回乡证；
        CRED_PSN_CH_TWCARD-台胞证；
        CRED_PSN_PASSPORT-护照；
        CRED_PSN_CH_GREEN_CARD-外国人永久居留身份证

    # ===== 请求侧公共模型（创建签署流程） =====
    DocFile:
      type: object
      description: 待签署文件
      required: [fileId]
      properties:
        fileId: { type: string, description: 待签署文件ID }
        fileName:
          type: string
          maxLength: 100
          description: 文件名称（需含真实后缀，禁用特殊字符 / \ : * " &lt; &gt; | ？及 emoji）
        neededPwd: { type: boolean, default: false, description: 是否需要密码 }
        fileEditPwd: { type: string, description: 文件编辑密码 }
        contractBizTypeId: { type: string, description: 合同类型ID（智能台账） }
        order: { type: integer, minimum: 1, maximum: 50, description: 文件展示顺序 }

    Attachment:
      type: object
      description: 附属材料/合同附件（不参与签署）
      properties:
        fileId: { type: string }
        fileName: { type: string }

    RedirectConfig:
      type: object
      properties:
        redirectUrl: { type: string, description: 跳转页面（https/http） }
        redirectDelayTime:
          type: integer
          format: int32
          enum: [0, 3]
          default: 3
          description: 跳转延迟时间（秒）

    NoticeConfig:
      type: object
      properties:
        noticeTypes:
          type: string
          description: 通知类型（空-不通知，1-短信，2-邮件，3-钉钉，5-微信，6-企微，7-飞书，逗号分隔）
        examineNotice: { type: boolean, description: 通知给企业印章用印审批人员 }

    AuthConfig:
      type: object
      description: 流程整体认证配置项
      properties:
        willingnessAuthModes:
          type: array
          items:
            type: string
            enum: [CODE_SMS, PSN_FACE_ALIPAY, PSN_FACE_ESIGN, PSN_FACE_WECHAT, SIGN_PWD, PSN_FACE_TECENT, PSN_AUDIO_VIDEO_ESIGN, PSN_AUDIO_VIDEO_ALIPAY, PSN_AUDIO_VIDEO_WECHAT, PSN_MOBILE_FACE_AUTH]
        psnAvailableAuthModes:
          type: array
          items:
            type: string
            enum: [PSN_MOBILE3, PSN_FACE, PSN_BANKCARD4, PSN_AUDIO_VIDEO_ESIGN]
        psnAuthAdvancedEnabled:
          type: array
          items: { type: string }
        orgAvailableAuthModes:
          type: array
          items:
            type: string
            enum: [ORG_BANK_TRANSFER, ORG_ALIPAY_CREDIT, ORG_LEGALREP_AUTHORIZATION, ORG_LEGALREP]
        globalWillingness: { type: boolean, default: true }
        globalAuthModes:
          type: string
          enum: [MAINLAND_REAL_NAME, NO_NEED, ACCESS_CODE]
          default: MAINLAND_REAL_NAME
        globalAccessCode: { type: string, minLength: 6, maxLength: 45 }
        audioVideoTemplateId: { type: string }
        audioVideoActiveField:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
        uneditableFields:
          type: array
          items: { type: string, enum: [orgIDCardNum, psnIDCardType, psnMobile] }

    ContractConfig:
      type: object
      properties:
        contractSecrecy: { type: integer, enum: [1, 2], default: 1 }
        allowToRescind: { type: boolean, default: true }
        contractExpirationDate: { type: integer, format: int64 }

    FlowSignConfig:
      type: object
      properties:
        availableSignClientTypes: { type: string, default: "1,2" }
        showBatchDropSealButton: { type: boolean, default: true }
        signTipsTitle: { type: string, maxLength: 20 }
        signTipsContent: { type: string, maxLength: 500 }
        signMode: { type: string, enum: [NORMAL, GLOBAL], default: NORMAL }
        dedicatedCloudId: { type: string }
        signType: { type: string }
        fdaLanguageMode: { type: string, enum: [CHINESE, ENGLISH], default: CHINESE }
        fdaSigningReason:
          type: array
          items: { type: string }
          maxItems: 5

    SignFlowConfigRequest:
      type: object
      description: 签署流程配置项（请求侧）
      required: [signFlowTitle]
      properties:
        signFlowTitle: { type: string }
        signFlowExpireTime: { type: integer, format: int64 }
        autoStart: { type: boolean, default: true }
        autoFinish: { type: boolean, default: false }
        identityVerify: { type: boolean, default: true }
        notifyUrl: { type: string }
        redirectConfig: { $ref: '#/components/schemas/RedirectConfig' }
        signConfig: { $ref: '#/components/schemas/FlowSignConfig' }
        noticeConfig: { $ref: '#/components/schemas/NoticeConfig' }
        authConfig: { $ref: '#/components/schemas/AuthConfig' }
        contractConfig: { $ref: '#/components/schemas/ContractConfig' }
        contractGroupIds:
          type: array
          items: { type: string }
          maxItems: 10
        docsViewLimited: { type: boolean, default: false }

    SignFlowInitiatorRequest:
      type: object
      description: 签署流程的发起方（请求侧）
      properties:
        orgInitiator:
          type: object
          properties:
            orgId: { type: string }
            transactor:
              type: object
              properties:
                psnId: { type: string }
        psnInitiator:
          type: object
          properties:
            psnId: { type: string }
        initialRemarks:
          type: array
          items: { type: string, maxLength: 300 }
          maxItems: 1

    SignerSignConfig:
      type: object
      properties:
        signOrder: { type: integer, format: int32, minimum: 1, maximum: 255 }
        forcedReadingTime: { type: integer, format: int32, minimum: 0, maximum: 999 }
        fileForcedReadingTime: { type: integer, format: int32, minimum: 0, maximum: 999 }
        agreeSkipWillingness: { type: boolean, default: false }
        signTaskType: { type: integer, format: int32, enum: [0, 1], default: 0, description: 0-会签，1-或签 }
        signTipsTitle: { type: string, maxLength: 20 }
        signTipsContent: { type: string, maxLength: 500 }
        signTipsFileId: { type: string }
        uploadFiles:
          type: array
          items:
            type: object
            properties:
              uploadDescription: { type: string }
              required: { type: boolean, default: true }
              fileOrder: { type: integer, minimum: 1, maximum: 50 }
              multiple: { type: boolean, default: false }
        docsViewType: { type: integer, format: int32, enum: [1, 2], default: 1 }
        viewableFileIds:
          type: array
          items: { type: string }

    OrgSignerInfo:
      type: object
      description: 企业/机构签署方信息
      properties:
        orgId: { type: string }
        orgName: { type: string }
        orgInfo:
          type: object
          properties:
            legalRepName: { type: string }
            legalRepIDCardNum: { type: string }
            legalRepIDCardType:
              type: string
              enum: [CRED_PSN_CH_IDCARD, CRED_PSN_CH_HONGKONG, CRED_PSN_CH_MACAO, CRED_PSN_CH_TWCARD, CRED_PSN_PASSPORT]
            orgIDCardNum: { type: string }
            orgIDCardType:
              type: string
              enum: [CRED_ORG_USCC, CRED_ORG_REGCODE]
        transactorInfo: { $ref: '#/components/schemas/TransactorInfo' }

    TransactorInfo:
      type: object
      description: 企业/机构经办人信息（autoSign=true 不要传）
      properties:
        psnAccount: { type: string }
        psnId: { type: string }
        psnInfo:
          type: object
          required: [psnName]
          properties:
            psnName: { type: string }
            psnIDCardNum: { type: string }
            psnIDCardType:
              $ref: '#/components/schemas/PsnIDCardType'
            bankCardNum: { type: string }

    PsnSignerInfo:
      type: object
      description: 个人签署方信息
      properties:
        psnAccount: { type: string }
        psnId: { type: string }
        psnInfo:
          type: object
          required: [psnName]
          properties:
            psnName: { type: string }
            psnIDCardNum: { type: string }
            psnIDCardType:
              $ref: '#/components/schemas/PsnIDCardType'
            psnMobile: { type: string }
            bankCardNum: { type: string }

    SignFieldPositionRequest:
      type: object
      description: 签署区位置（请求侧）
      properties:
        acrossPageMode:
          type: string
          enum: [ALL, AssignedPages]
        positionPage: { type: string }
        positionX: { type: number, format: float }
        positionY: { type: number, format: float }

    NormalSignFieldConfigRequest:
      type: object
      description: 签章区配置（signFieldType=0 时必传，请求侧）
      properties:
        freeMode: { type: boolean, default: false }
        autoSign: { type: boolean, default: false }
        movableSignField: { type: boolean, default: false }
        assignedSealId: { type: string }
        availableSealIds:
          type: array
          items: { type: string }
        orgSealBizTypes: { type: string, default: ALL }
        psnSealStyles: { type: string, default: "0,1" }
        signFieldSize: { type: number, format: float }
        signFieldWidth: { type: integer }
        signFieldHeight: { type: integer }
        signFieldStyle: { type: integer, format: int32, enum: [1, 2] }
        sealRotationAngle: { type: integer, enum: [90, 180, 270] }
        signFieldPosition:
          $ref: '#/components/schemas/SignFieldPositionRequest'

    RemarkSignFieldConfigRequest:
      type: object
      description: 备注区配置（signFieldType=1 时必传，请求侧，仅个人签署方）
      properties:
        freeMode: { type: boolean, default: false }
        inputType: { type: integer, format: int32, enum: [1, 2], default: 1 }
        aiCheck: { type: integer, format: int32, enum: [0, 1, 2], default: 0 }
        remarkContent: { type: string }
        movableSignField: { type: boolean, default: false }
        remarkFontSize: { type: integer, format: int32, default: 14 }
        signFieldHeight: { type: number, format: float }
        signFieldWidth: { type: number, format: float }
        signFieldPosition:
          $ref: '#/components/schemas/SignFieldPositionRequest'

    SignDateConfig:
      type: object
      properties:
        dateFormat: { type: string, default: "yyyy年MM月dd日" }
        fontSize: { type: integer, format: int32, default: 12 }
        showSignDate: { type: integer, format: int32, enum: [0, 1, 2], default: 0 }
        signDatePositionX: { type: number, format: float }
        signDatePositionY: { type: number, format: float }

    DateSignFieldConfigRequest:
      type: object
      description: 独立签署日期配置（signFieldType=2 时必传，请求侧）
      properties:
        autoSign: { type: boolean, default: false }
        dateFormat: { type: string, default: "yyyy年MM月dd日" }
        fontSize: { type: integer, default: 12, minimum: 5, maximum: 42 }
        signDatePositionPage: { type: integer }
        signDatePositionX: { type: number, format: float }
        signDatePositionY: { type: number, format: float }

    SignFieldRequest:
      type: object
      description: 签署区（请求侧）
      required: [fileId]
      properties:
        fileId: { type: string }
        customBizNum: { type: string }
        signFieldType: { type: integer, format: int32, enum: [0, 1, 2], default: 0 }
        mustSign: { type: boolean, default: true }
        normalSignFieldConfig:
          $ref: '#/components/schemas/NormalSignFieldConfigRequest'
        remarkSignFieldConfig:
          $ref: '#/components/schemas/RemarkSignFieldConfigRequest'
        signDateConfig:
          $ref: '#/components/schemas/SignDateConfig'
        dateSignFieldConfig:
          $ref: '#/components/schemas/DateSignFieldConfigRequest'

    Signer:
      type: object
      description: 签署方信息（请求侧）
      required: [signerType]
      properties:
        signConfig: { $ref: '#/components/schemas/SignerSignConfig' }
        authConfig: { $ref: '#/components/schemas/AuthConfig' }
        noticeConfig: { $ref: '#/components/schemas/NoticeConfig' }
        signerType:
          type: integer
          format: int32
          enum: [0, 1, 2, 3]
          description: 签署方类型（0-个人，1-企业/机构，2-法定代表人，3-经办人）
        signerRole: { type: string }
        orgSignerInfo: { $ref: '#/components/schemas/OrgSignerInfo' }
        psnSignerInfo: { $ref: '#/components/schemas/PsnSignerInfo' }
        signFields:
          type: array
          items: { $ref: '#/components/schemas/SignFieldRequest' }

    Copier:
      type: object
      properties:
        copierOrgInfo:
          type: object
          properties:
            orgName: { type: string }
            orgId: { type: string }
        copierPsnInfo:
          type: object
          properties:
            psnAccount: { type: string }
            psnId: { type: string }

    # ===== 响应侧公共模型 =====
    Transactor:
      type: object
      properties:
        psnId: { type: string }
        psnName: { type: string }
        psnAccount: { $ref: '#/components/schemas/PsnAccount' }

    PsnSignerBrief:
      type: object
      properties:
        psnId: { type: string }
        psnName: { type: string }
        psnAccount: { $ref: '#/components/schemas/PsnAccount' }

    OrgSignerBrief:
      type: object
      properties:
        orgId: { type: string }
        orgName: { type: string }
        transactor: { $ref: '#/components/schemas/Transactor' }

    SignFlowInitiator:
      type: object
      description: 签署流程发起方（响应侧）
      properties:
        psnInitiator:
          type: object
          nullable: true
          properties:
            psnId: { type: string }
            psnName: { type: string }
            psnAccount: { $ref: '#/components/schemas/PsnAccount' }
        orgInitiator:
          type: object
          nullable: true
          properties:
            orgId: { type: string }
            orgName: { type: string }
            transactor: { $ref: '#/components/schemas/Transactor' }

    SignFlowConfig:
      type: object
      description: 签署流程配置项（响应侧）
      properties:
        signFlowTitle: { type: string }
        contractGroupIds: { type: array, items: { type: string } }
        autoFinish: { type: boolean }
        signFlowExpireTime: { type: integer, format: int64 }
        notifyUrl: { type: string }
        chargeConfig:
          type: object
          properties:
            chargeMode: { type: integer, enum: [0, 1] }
            orderType: { type: string }
            barrierCode: { type: string }
        noticeConfig:
          type: object
          properties:
            noticeTypes: { type: string }
            examineNotice: { type: boolean, nullable: true }
        signConfig:
          type: object
          properties:
            availableSignClientTypes: { type: string }
            showBatchDropSealButton: { type: boolean }
            signMode: { type: string, enum: [NORMAL, GLOBAL] }
            dedicatedCloudId: { type: string }
            forcedNotarize: { type: boolean }
            serviceCode: { type: string }
        authConfig: { $ref: '#/components/schemas/AuthConfig' }

    SignFlowDoc:
      type: object
      properties:
        fileId: { type: string }
        fileName: { type: string }
        fileEditPwd: { type: string }
        contractNum: { type: string }
        contractBizTypeId: { type: string }

    SignFlowAttachment:
      type: object
      properties:
        fileId: { type: string }
        fileName: { type: string }
        signerUpload: { type: boolean }

    SignFieldPositionDetail:
      type: object
      description: 签署区位置（响应侧）
      properties:
        positionPage: { type: string }
        positionX: { type: number, format: float }
        positionY: { type: number, format: float }

    NormalSignFieldConfigDetail:
      type: object
      description: 签章区配置（响应侧）
      properties:
        freeMode: { type: boolean }
        signFieldStyle: { type: integer, enum: [1, 2] }
        signFieldPosition: { $ref: '#/components/schemas/SignFieldPositionDetail' }
        movableSignField: { type: boolean }
        autoSign: { type: boolean }
        sealStyle: { type: string }
        sealId: { type: string }
        sealOwnerId: { type: string }
        handWrittenFileKey: { type: string }

    RemarkSignFieldConfigDetail:
      type: object
      description: 备注区配置（响应侧）
      properties:
        inputType: { type: integer, enum: [1, 2] }
        movableSignField: { type: boolean }
        freeMode: { type: boolean }
        remarkContent: { type: string }
        remarkImageFileKey: { type: string }
        signFieldPositionBean: { $ref: '#/components/schemas/SignFieldPositionDetail' }
        actualContent: { type: string }

    DateSignFieldConfigDetail:
      type: object
      description: 独立签署日期配置（响应侧）
      properties:
        dateFormat: { type: string, enum: ["yyyy年MM月dd日", "yyyy-MM-dd", "yyyy/MM/dd"] }
        fontSize: { type: integer }
        signDatePositionPage: { type: integer }
        signDatePositionX: { type: number, format: float }
        signDatePositionY: { type: number, format: float }

    SignFieldDetail:
      type: object
      description: 签署区（响应侧）
